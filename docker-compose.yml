services:
  ja-vpngate-proxy:
    # GitHub Actionsがmainへのpushごとにビルドしてpushしているイメージ
    # このファイル単体をサーバに置いても動くように build: は書いていない
    # (リポジトリ内では docker-compose.override.yml がソースビルドに切り替える)
    image: ghcr.io/broccoligg/ja-vpngate-proxy:${IMAGE_TAG:-latest}
    container_name: ja-vpngate-proxy
    # OpenVPNがtunデバイスを作成・ルーティングを変更するために必要
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # VPN接続後もホスト側のDNSに引きずられないように明示的に指定
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 9.9.9.9
    ports:
      - "${PROXY_PORT:-8118}:8118"
    environment:
      # 接続対象とするVPNサーバの最低速度(bps)。デフォルトは200Mbps
      MIN_SPEED: "${MIN_SPEED:-200000000}"
      # 使用するOpenVPNのプロトコル。udp / tcp / any (デフォルトはany)
      PROTO: "${PROTO:-any}"
    restart: unless-stopped
